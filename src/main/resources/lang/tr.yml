# ======================================
# GUI Yapılandırması (Başlıklar ve Eşya Metinleri)
# ======================================
gui:
  orders:
    title: "&#444444sɪᴘᴀʀɪşʟᴇʀ"
    format:
      selected_prefix: "&#34ee80• "
      unselected_prefix: "&f• "
    items:
      prev:
        displayname: "&#34ee80ɢᴇʀɪ"
        lore:
          - "&fÖnceki sayfaya git"
      sort:
        displayname: "&#34ee80sɪʀᴀʟᴀ"
        lore: []
      filter:
        displayname: "&#34ee80ꜰɪʟᴛʀᴇ"
        lore: []
      refresh:
        displayname: "&#34ee80ʏᴇɴɪʟᴇ"
        lore:
          - "&fYenilemek için tıkla"
      search:
        displayname: "&#34ee80ᴀʀᴀ"
        lore:
          - "&fAramak için tıkla"
      your:
        displayname: "&#34ee80sɪᴘᴀʀɪşʟᴇʀɪᴍ"
        lore:
          - "&fSiparişlerini görmek için tıkla"
      next:
        displayname: "&#34ee80ɪʟᴇʀɪ"
        lore:
          - "&fSonraki sayfaya git"
      order-item:
        displayname: "&#34ee80{player} Siparişi"
        lore:
          - "&f{item}"
          - "&#34ee80${price_each} &ftanesi"
          - ""
          - "&#7E7E29{delivered}/&#008D4C{requested} &#858585Teslim Edildi"
          - "&#7E7E29${paid}/&#008D4C${total} &#858585ödendi"
          - ""
          - "&f&#34ee80{player} &fiçin teslim et {item}"

  your:
    title: "&#444444sɪᴘᴀʀɪşʟᴇʀ -> Siparişlerim"
    items:
      order-item:
        displayname: "&#34ee80{player} Siparişi"
        lore:
          - "&#34ee80{requested} &f{item}"
          - "&#34ee80${price_each} &ftanesi"
          - ""
          - "&#7E7E29{delivered}/&#008D4C{requested} &#858585Teslim Edildi"
          - "&#7E7E29${paid}/&#008D4C${total} &#858585Ödendi"
      new:
        displayname: "&#34ee80Yeni Sipariş"
        lore:
          - "&fYeni sipariş oluştur"

  new:
    title: "&#444444sɪᴘᴀʀɪş -> Yeni Sipariş"
    filler:
      displayname: "&7 "
    items:
      cancel:
        displayname: "&#FF3B3Bɪᴘᴛᴀʟ"
        lore:
          - "&fGeri dönmek için tıkla"
      item:
        displayname: "&#34ee80ᴇşʏᴀ"
        lore:
          - "&fEşya seçmek için tıkla"
          - "&7({item})"
      amount:
        displayname: "&#34ee80ᴍɪᴋᴛᴀʀ"
        lore:
          - "&fEşya sayısını yazmak için tıkla"
          - "&7({amount})"
      price:
        displayname: "&#34ee80ꜰɪʏᴀᴛ"
        lore:
          - "&fEşya başına fiyat yazmak için tıkla"
          - "&7(${price_each})"
      confirm:
        displayname: "&#39FF14ᴏɴᴀʏʟᴀ"
        lore:
          - "&fSiparişi onaylamak için tıkla"
          - "&7(Toplam: ${total})"

  select:
    title: "&#444444sɪᴘᴀʀɪş -> Eşya Seç"
    format:
      selected_prefix: "&#34ee80• "
      unselected_prefix: "&f• "
    items:
      prev:
        displayname: "&#34ee80ɢᴇʀɪ"
        lore:
          - "&fÖnceki sayfaya git"
      next:
        displayname: "&#34ee80ɪʟᴇʀɪ"
        lore:
          - "&fSonraki sayfaya git"
      sort:
        displayname: "&#34ee80sɪʀᴀʟᴀ"
        lore: []
      filter:
        displayname: "&#34ee80ꜰɪʟᴛʀᴇ"
        lore: []
      search:
        displayname: "&#34ee80ᴀʀᴀ"
        lore:
          - "&fAramak için tıkla"
      item:
        displayname: "&f{item}"
        lore:
          - "&fSeçmek için tıkla"

  edit:
    title: "&#444444sɪᴘᴀʀɪşʟᴇʀ -> Sipariş Düzenle"
    filler:
      displayname: "&7 "
    items:
      target:
        displayname: "&#34ee80{player} Siparişi"
        lore:
          - "&f{item}"
          - "&#34ee80${price_each} &ftanesi"
          - ""
          - "&#7E7E29{delivered}/&#008D4C{requested} &#858585Teslim Edildi"
          - "&#7E7E29${paid}/&#008D4C${total} &#858585ödendi"
          - ""
      cancel:
        displayname: "&cɪᴘᴛᴀʟ"
        lore:
          - "&fBu siparişi iptal et"
      collect:
        displayname: "&fᴛᴏᴘʟᴀ"
        lore:
          - "&fEşyaları topla"

  delete:
    title: "&#444444sɪᴘᴀʀɪşʟᴇʀ -> Sipariş Sil"
    items:
      back:
        displayname: "&#FF3B3Bɢᴇʀɪ"
        lore:
          - "&fGeri dön"
      confirm:
        displayname: "&#39FF14ᴏɴᴀʏʟᴀ"
        lore:
          - "&fBu siparişi silmek için tıkla!"

  collect:
    title: "&#444444sɪᴘᴀʀɪşʟᴇʀ -> Eşya Topla"
    filler:
      displayname: "&7 "
    items:
      prev:
        displayname: "&#34ee80ɢᴇʀɪ"
        lore:
          - "&fÖnceki sayfaya git"
      next:
        displayname: "&#34ee80ɪʟᴇʀɪ"
        lore:
          - "&fSonraki sayfaya git"
      drop:
        displayname: "&#34ee80ᴇşʏᴀ ᴀᴛ"
        lore:
          - "&fSayfadaki tüm eşyaları yere at"

  deliver:
    title: "&#444444sɪᴘᴀʀɪşʟᴇʀ -> Eşya Teslim Et"
    items:
      confirm:
        displayname: "&#39FF14ONAYLA"
        lore:
          - "&fTeslimatı onaylamak için tıkla"
          - "&7(Sadece seçili eşyalar sayılacak)"

  confirm:
    title: "&#444444sɪᴘᴀʀɪşʟᴇʀ -> Teslimatı Onayla"
    items:
      cancel:
        displayname: "&#FF3B3Bɪᴘᴛᴀʟ"
        lore: "&fGeri dönmek için tıkla"
      summary:
        displayname: "&f{player} Siparişi"
        lore:
          - "&#34ee80{amount} &f{item}"
          - "&#34ee80${price_each} &ftanesi"
          - ""
          - "&7&#34ee80{amount} &f{item} teslim edeceksiniz"
      confirm:
        displayname: "&#39FF14ᴏɴᴀʏʟᴀ"
        lore:
          - "&fEşyaları teslim et"
          - "&7({receive})"

