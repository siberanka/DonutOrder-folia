  reloaded: "&aDonutOrder configuration reloaded!"
  unknown_command: "&cUnknown subcommand."
  reload_usage: "&cUsage: /donutorder reload"
  order_created: "&aOrder created successfully!"
  order_cancelled: "&aOrder cancelled."
  order_delivered: "&aYou delivered {amount}x {item} to {player}!"
  order_received: "&a{player} delivered {amount}x {item} to your order!"
  order_complete: "&aYour order for {item} has been completed!"
  not_enough_items: "&cYou don't have enough items to deliver."
  inventory_full: "&cYour inventory is full!"
  no_orders: "&7There are no orders to display."
  player_offline: "&cThat player is offline."
  order_full: "&#9e9e9eOrder is &#16bf6dfull&#9e9e9e."
  received_actionbar: "&#16bf6d{player} &#9e9e9ehas delivered you &#16bf6d{amount} {item}&#9e9e9e!"
  completed_actionbar: "&#34ee80{item} &#9e9e9eorder is now &#39FF14COMPLETED&#9e9e9e!"
  # Price and amount validation
  amount_min: "&cAmount must be at least 1."
  amount_max: "&cAmount limit is {max} items per order."
  amount_invalid: "&cInvalid amount. Please enter a whole number (e.g. 64)."
