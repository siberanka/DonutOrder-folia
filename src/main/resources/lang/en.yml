  storage_full: "&cOrder storage is full! Cannot deliver more items."
  no_valid_items: "&cNo valid items provided."
  order_in_use: "&cThis order is currently being viewed by someone else."
  internal_menu_error: "&cAn internal error occurred. Menu closed for safety."
  order_create_failed: "&cOrder creation failed: {error}"
  order_refunded: "&e{amount} has been refunded."
  price_format_invalid: "&cInvalid price. Please enter a number (e.g. 2.5)."
