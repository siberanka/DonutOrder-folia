# DonutOrder Configuration
# All text/messages are in lang/ files (en.yml, tr.yml)
# This file contains only layout and settings

# Language setting - options: en, tr
default-language: en

# Items that cannot be ordered
disabled-items:
  - SPAWNER
  - SPAWNER_EGGS

# Minimum price per item to prevent abuse (default: 0.05)
minimum-price-per-item: 0.05

# Maximum price per item (default: 1 trillion)
maximum-price-per-item: 1000000000000.0

# Maximum items per order (default: 1,000,000)
maximum-items-per-order: 1000000

# ======================================
# Sign Input Configuration
# ======================================
search-sign:
  lines:
    - ""
    - "↑↑↑↑↑↑↑↑↑↑↑↑↑↑"
    - "Search"
    - ""
  input-line: 1

amount-sign:
  lines:
    - ""
    - "↑↑↑↑↑↑↑↑↑↑↑↑↑↑"
    - "Amount"
    - ""
  input-line: 1

price-sign:
  lines:
    - ""
    - "↑↑↑↑↑↑↑↑↑↑↑↑↑↑"
    - "Price"
    - ""
  input-line: 1

# ======================================
# Sound Configuration
# ======================================
sounds:
  click:
    sound: UI_BUTTON_CLICK
    volume: 1.0
    pitch: 1.0
  page:
    sound: ITEM_BOOK_PAGE_TURN
    volume: 1.0
    pitch: 1.1
  refresh:
    sound: UI_TOAST_IN
    volume: 1.0
    pitch: 1.0
  open:
    sound: BLOCK_CHEST_OPEN
    volume: 0.7
    pitch: 1.0
  confirm:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.2
  cancel:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.8
  received:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.2

# ======================================
# GUI Layout Configuration
# Only slot positions and materials - text is in lang files
# ======================================
gui:
  orders:
    rows: 6
    items:
      prev:
        slot: 45
        material: ARROW
      sort:
        slot: 47
        material: CAULDRON
      filter:
        slot: 48
        material: HOPPER
      refresh:
        slot: 49
        material: MAP
      search:
        slot: 50
        material: OAK_SIGN
      your:
        slot: 51
        material: CHEST
      next:
        slot: 53
        material: ARROW

  your:
    rows: 3
    items:
      new:
        material: MAP

  new:
    rows: 3
    filler:
      enabled: true
      slots: "1,9,10"
      material: GRAY_STAINED_GLASS_PANE
    items:
      cancel:
        material: RED_STAINED_GLASS_PANE
      item:
        material: STONE
      amount:
        material: CHEST
      price:
        material: EMERALD
      confirm:
        material: LIME_STAINED_GLASS_PANE

  select:
    rows: 6
    items:
      prev:
        slot: 45
        material: ARROW
      next:
        slot: 53
        material: ARROW
      sort:
        slot: 48
        material: CAULDRON
      filter:
        slot: 49
        material: HOPPER
      search:
        slot: 50
        material: OAK_SIGN

  edit:
    rows: 3
    filler:
      enabled: true
      slots: "0,1,2,9,11,18,19,20"
      material: GRAY_STAINED_GLASS_PANE
    items:
      cancel:
        material: RED_TERRACOTTA
      collect:
        material: CHEST

  delete:
    rows: 3
    items:
      back:
        slot: 10
        material: RED_STAINED_GLASS_PANE
      confirm:
        slot: 16
        material: LIME_STAINED_GLASS_PANE

  collect:
    rows: 6
    items:
      prev:
        slot: 45
        material: ARROW
      next:
        slot: 53
        material: ARROW
      drop:
        slot: 52
        material: DROPPER
    filler:
      material: GRAY_STAINED_GLASS_PANE

  deliver:
    rows: 4
    items:
      confirm:
        slot: 35
        material: LIME_STAINED_GLASS_PANE

  confirm:
    rows: 3
    items:
      cancel:
        material: RED_STAINED_GLASS_PANE
      confirm:
        material: LIME_STAINED_GLASS_PANE
